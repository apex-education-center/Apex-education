<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
  <title>Contact Owner — Apex Education Center</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cinematic.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="contact" class="apex-cinema">
  <div class="page-loader"><svg class="loader-mark" viewBox="0 0 32 32"><path d="M16 4 L28 26 L4 26 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 12 L23 26 L9 26 Z" fill="currentColor"/></svg></div>
  <div id="site-header"></div>
  <main class="contact-main">
    <section class="page-hero page-hero-cinema" data-scene="contact">
      <div class="ph-layers" aria-hidden="true">
        <div class="ph-aurora"></div>
        <div class="ph-grid"></div>
        <div class="ph-orb ph-orb-a"></div>
        <div class="ph-orb ph-orb-b"></div>
        <div class="ph-particles"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="ph-watermark">APEX</div>
      </div>
      <div class="container ph-content">
        <span class="eyebrow">Direct line</span>
        <h1>Contact Owner</h1>
        <p>One form. Every message routes directly to apex.</p>
      </div>
    </section>
    <section class="contact-layout-section cinema-stage">
      <div class="container contact-layout">
        <div id="contactOwnerMount" data-variant="full"></div>
        <aside class="contact-aside reveal">
          <div class="contact-info-panel glass-panel">
            <h3>Visit &amp; connect</h3>
            <div id="contactInfoMount"></div>
          </div>
          <div class="map-shell glass-panel">
            <iframe id="contactMap" class="map-frame" loading="lazy" title="Apex Education Center location"></iframe>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
  <title>Courses — Apex Education Center</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cinematic.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="courses" class="apex-cinema">
  <div class="page-loader"><svg class="loader-mark" viewBox="0 0 32 32"><path d="M16 4 L28 26 L4 26 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 12 L23 26 L9 26 Z" fill="currentColor"/></svg></div>
  <div id="site-header"></div>
  <main>
    <section class="page-hero page-hero-cinema" data-scene="courses">
      <div class="ph-layers" aria-hidden="true">
        <div class="ph-aurora"></div>
        <div class="ph-grid"></div>
        <div class="ph-orb ph-orb-a"></div>
        <div class="ph-orb ph-orb-b"></div>
        <div class="ph-particles"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="ph-watermark">COURSES</div>
      </div>
      <div class="container ph-content">
        <span class="eyebrow">Catalog</span>
        <h1>Find the right course</h1>
        <p>Search or filter by subject and teaching mode — every course is built for real understanding.</p>
      </div>
    </section>
    <section class="cinema-stage">
      <div class="container">
        <div class="search-bar">
          <input type="text" id="courseSearch" placeholder="Search courses…" aria-label="Search courses" />
        </div>
        <div class="filter-bar" id="categoryFilterBar"></div>
        <div class="filter-bar" id="modeFilterBar">
          <button class="filter-btn active" data-mode="all">All Modes</button>
          <button class="filter-btn" data-mode="online">Online</button>
          <button class="filter-btn" data-mode="présentiel">Présentiel</button>
        </div>
        <div class="filter-bar" id="languageFilterBar">
          <button class="filter-btn active" data-language="all">All Languages</button>
          <button class="filter-btn" data-language="english">English</button>
          <button class="filter-btn" data-language="french">Français</button>
        </div>
        <div class="filter-bar" id="bacFilterBarCourses">
          <button class="filter-btn active" data-bac="all">All Bac Systems</button>
          <button class="filter-btn" data-bac="libanais">Bac Libanais</button>
          <button class="filter-btn" data-bac="francais">Bac Français</button>
        </div>
        <div class="filter-panel" id="priceBar">
          <div class="filter-sort">
            <label for="priceSort">Sort by price</label>
            <select id="priceSort">
              <option value="default">Default</option>
              <option value="price-asc">Lowest to highest</option>
              <option value="price-desc">Highest to lowest</option>
            </select>
          </div>
          <div class="range-field">
            <div class="range-field-head">
              <label>Price range</label>
              <span class="range-field-values"><span id="priceMinLabel">$0</span> – <span id="priceMaxLabel">$0</span> /hr</span>
            </div>
            <div class="range-slider">
              <div class="range-slider-track"><div class="range-slider-fill" id="priceFill"></div></div>
              <input type="range" id="priceMin" />
              <input type="range" id="priceMax" />
            </div>
          </div>
        </div>
        <p id="resultCount" style="text-align:left;color:var(--text-faint);font-size:0.88rem;margin-bottom:24px;"></p>
        <div class="card-grid" id="coursesGrid"></div>
        <div class="empty-state" id="coursesEmpty" style="display:none;">
          <p>No courses match your filters. Try clearing a filter or searching a different term.</p>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/courses.js"></script>
</body>
</html>

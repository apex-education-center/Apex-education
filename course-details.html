<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
  <title>Course Details — Apex Education Center</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cinematic.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="courses" class="apex-cinema">
  <div class="page-loader"><svg class="loader-mark" viewBox="0 0 32 32"><path d="M16 4 L28 26 L4 26 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 12 L23 26 L9 26 Z" fill="currentColor"/></svg></div>
  <div id="site-header"></div>
  <main>
    <section class="page-hero page-hero-cinema" data-scene="courses" style="min-height:28vh;padding-bottom:48px;">
      <div class="ph-layers" aria-hidden="true">
        <div class="ph-aurora"></div>
        <div class="ph-grid"></div>
        <div class="ph-watermark">DETAIL</div>
      </div>
      <div class="container ph-content">
        <span class="eyebrow">Course</span>
        <h1 style="font-size:clamp(2rem,4vw,3rem);">Course details</h1>
      </div>
    </section>
    <section class="cinema-stage" style="padding-top:0;">
      <div class="container" id="courseDetailMount"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/courses.js"></script>

</html>

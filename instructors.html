<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
  <title>Instructors — Apex Education Center</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cinematic.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="instructors" class="apex-cinema">
  <div class="page-loader"><svg class="loader-mark" viewBox="0 0 32 32"><path d="M16 4 L28 26 L4 26 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 12 L23 26 L9 26 Z" fill="currentColor"/></svg></div>
  <div id="site-header"></div>
  <main>
    <section class="page-hero page-hero-cinema" data-scene="instructors">
      <div class="ph-layers" aria-hidden="true">
        <div class="ph-aurora"></div>
        <div class="ph-grid"></div>
        <div class="ph-orb ph-orb-a"></div>
        <div class="ph-orb ph-orb-b"></div>
        <div class="ph-particles"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="ph-watermark">TEAM</div>
      </div>
      <div class="container ph-content">
        <span class="eyebrow">Our Team</span>
        <h1>Meet the instructors</h1>
        <p>Every instructor is personally vetted for subject mastery and a genuine gift for teaching.</p>
      </div>
    </section>
    <section class="cinema-stage">
      <div class="container">
        <div class="filter-bar" id="subjectFilterBar"></div>
        <div class="filter-bar" id="nationalityFilterBar"></div>
        <div class="filter-bar" id="bacFilterBarInstructors">
          <button class="filter-btn active" data-bac="all">All Bac Systems</button>
          <button class="filter-btn" data-bac="libanais">Bac Libanais</button>
          <button class="filter-btn" data-bac="francais">Bac Français</button>
        </div>
        <div class="filter-bar" id="dayFilterBar">
          <span class="filter-bar-label">Available on:</span>
          <button class="filter-btn active" data-day="all">All</button>
          <button class="filter-btn" data-day="sun">Sun</button>
          <button class="filter-btn" data-day="mon">Mon</button>
          <button class="filter-btn" data-day="tue">Tue</button>
          <button class="filter-btn" data-day="wed">Wed</button>
          <button class="filter-btn" data-day="thu">Thu</button>
          <button class="filter-btn" data-day="fri">Fri</button>
          <button class="filter-btn" data-day="sat">Sat</button>
        </div>
        <div class="filter-panel" id="experienceBar">
          <div class="filter-sort">
            <label for="experienceSort">Sort by experience</label>
            <select id="experienceSort">
              <option value="default">Default</option>
              <option value="exp-asc">Lowest to highest</option>
              <option value="exp-desc">Highest to lowest</option>
            </select>
          </div>
          <div class="range-field">
            <div class="range-field-head">
              <label>Experience</label>
              <span class="range-field-values"><span id="experienceMinLabel">0</span> – <span id="experienceMaxLabel">0</span> yrs</span>
            </div>
            <div class="range-slider">
              <div class="range-slider-track"><div class="range-slider-fill" id="experienceFill"></div></div>
              <input type="range" id="experienceMin" />
              <input type="range" id="experienceMax" />
            </div>
          </div>
        </div>
        <p id="instructorResultCount" style="text-align:left;color:var(--text-faint);font-size:0.88rem;margin-bottom:24px;"></p>
        <div class="card-grid" id="instructorsGrid"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
